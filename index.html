<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Cosmic Defender - Wave & Boss Shooter</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #04060d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-wrapper {
            /* flex: 1; */
            width: 100%;
            max-width: 480px;
            height: 100dvh;
            max-height: 920px;
            border: 1px solid #1e293b;
            background: #060913;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
</head>

<body>
    <div id="game-wrapper">
        <canvas id="gameCanvas" width="480" height="800"></canvas>
    </div>

    <!-- Urutan pemanggilan penting: config.js dulu, baru game.js, lalu devtool.js -->
    <script src="config.js"></script>
    <script src="game.js"></script>
    <!-- <script src="devtool.js"></script> -->
</body>

</html>
